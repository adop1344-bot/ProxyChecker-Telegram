name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      run: |
        mkdir -p /tmp/init
        cd /tmp/init
        echo "rootProject.name = \"t\"" > settings.gradle
        gradle wrapper --gradle-version=8.9
        cp gradlew gradlew.bat $GITHUB_WORKSPACE/
        mkdir -p $GITHUB_WORKSPACE/gradle/wrapper
        cp gradle/wrapper/gradle-wrapper.jar $GITHUB_WORKSPACE/gradle/wrapper/
        cp gradle/wrapper/gradle-wrapper.properties $GITHUB_WORKSPACE/gradle/wrapper/
        chmod +x $GITHUB_WORKSPACE/gradlew
        mkdir -p ~/.android
        keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US" -alias androiddebugkey 2>/dev/null || true
    - name: Build
      run: ./gradlew assembleRelease --no-daemon
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: proxy-checker
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
