name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Generate Gradle Wrapper
      run: |
        mkdir -p /tmp/gradle-init
        cd /tmp/gradle-init
        # Create minimal settings.gradle so gradle wrapper works
        echo 'rootProject.name = "temp"' > settings.gradle
        # Generate wrapper with desired version
        gradle wrapper --gradle-version=8.9
        # Copy to workspace
        cp gradlew gradlew.bat $GITHUB_WORKSPACE/
        mkdir -p $GITHUB_WORKSPACE/gradle/wrapper
        cp gradle/wrapper/gradle-wrapper.jar $GITHUB_WORKSPACE/gradle/wrapper/
        cp gradle/wrapper/gradle-wrapper.properties $GITHUB_WORKSPACE/gradle/wrapper/
        chmod +x $GITHUB_WORKSPACE/gradlew
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: proxy-checker-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
